components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: token
      description: "JWT。源站用 token 头（非 Authorization: Bearer），不可更改。"
  parameters:
    Token:
      name: token
      in: header
      required: true
      schema: { type: string }
      description: "登录接口返回的 JWT"
  schemas:
    Envelope:
      type: object
      required: [code, msg, data, time]
      properties:
        code:
          type: integer
          description: 1=成功；400/401/403/404/409/422/500/503=错误。**1 是成功，不是 0**
          enum: [1, 400, 401, 403, 404, 409, 422, 500, 503]
          example: 1
        msg:
          type: string
          example: ok
        data:
          description: 业务数据。形状按接口而定，共 5 种封装风格
        time:
          type: string
          format: date-time
